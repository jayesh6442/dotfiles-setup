# Based on craftzdog/dotfiles-public tmux config, adapted for Linux (Wayland + kitty)

# ---- terminal / colors ----
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"
# undercurl + colored underlines (for nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ---- prefix: Ctrl-t (craftzdog) ----
unbind C-b
set -g prefix C-t
bind C-t send-prefix          # press Ctrl-t twice to send a literal Ctrl-t

# ---- basics ----
set -g repeat-time 0
set -g focus-events on        # nvim autoread / gitsigns refresh on focus
set -sg escape-time 10
set -g mouse on
set -g base-index 1           # windows start at 1 (easier to reach)
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 1000000
set -g set-clipboard on
set -g allow-passthrough on   # images / OSC sequences from apps inside tmux
set -g set-titles on
set -g set-titles-string "#T"
setw -g mode-keys vi
# Pane text uses the terminal's own foreground (craftzdog's colour10/colour12
# override was near-invisible with this kitty palette).

# ---- plugins (tpm) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'craftzdog/tmux-claude-hatch'

source ~/.config/tmux/bindings.conf
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf
source -q ~/.config/tmux/tmux-private.conf

# keep last so plugins load after our settings
run '~/.config/tmux/plugins/tpm/tpm'

# tmux-pain-control binds prefix C-l to select-pane; restore "clear screen"
bind C-l send-keys C-l
