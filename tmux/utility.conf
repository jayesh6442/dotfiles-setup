# vim: ft=tmux
# lazygit popup (needs: sudo pacman -S lazygit)
bind -r g display-popup -d '#{pane_current_path}' -w90% -h90% -E lazygit

# tmux-claude-hatch: prefix+y launch Claude popup for this dir, prefix+u agent picker
set -g @claude_sort "recent"
set -g @claude_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$CLAUDE_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"
