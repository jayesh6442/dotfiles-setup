# vim: ft=tmux

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open current directory in file manager (WSL: Windows Explorer)
bind o run-shell "cd '#{pane_current_path}' && if command -v explorer.exe >/dev/null; then explorer.exe . ; else xdg-open . ; fi >/dev/null 2>&1 &"
# Kill all other panes
bind -r e kill-pane -a

# Move windows left/right
bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# Splits / new windows keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- Seamless Ctrl-h/j/k/l between nvim splits and tmux panes ----
# If the pane runs nvim (or fzf), pass the key through; nvim itself moves to the
# neighbouring tmux pane when it is already at the edge (see nvim keymaps.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl-l used to clear the shell: use prefix + Ctrl-l for that now
bind C-l send-keys C-l

# ---- Code <-> agent ----
# prefix + a : jump to the agent pane in this window (press again to go back)
bind a run-shell "~/.local/bin/dev-agent-toggle"
# prefix + f : fuzzy-pick a project and open it with the dev layout
bind f display-popup -E -w 70% -h 60% "~/.local/bin/dev --pick"
# prefix + S : fuzzy-switch between running sessions
bind S display-popup -E -w 50% -h 50% "tmux list-sessions -F '#S' | fzf --prompt 'session> ' | xargs -r tmux switch-client -t"

# ---- copy mode (vi) -> system clipboard (WSL: win32yank/clip.exe, Wayland: wl-copy, X11: xclip) ----
COPY_CMD='if command -v win32yank.exe >/dev/null; then win32yank.exe -i --crlf; elif command -v clip.exe >/dev/null; then clip.exe; elif [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -selection clipboard; fi'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$COPY_CMD"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$COPY_CMD"
